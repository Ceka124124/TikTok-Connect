version: '3.8'

services:
  tiktok-streamer:
    build: .
    container_name: tiktok-render-streamer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - CLEANUP_TIMEOUT=300000
      - MAX_RECONNECT_ATTEMPTS=3
      - HEARTBEAT_INTERVAL=30000
      - MAX_CONNECTIONS_PER_USER=5
      - MAX_TOTAL_ROOMS=100
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SSE_RATE_LIMIT_MAX=30
      - LOG_LEVEL=info
      - LOG_FILE=logs/app.log
      - COMPRESSION_LEVEL=6
      - COMPRESSION_THRESHOLD=1024
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: tiktok-streamer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - tiktok-streamer
    profiles:
      - production